<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>⚡ SPEEDY SENSI GENERATOR | Free Fire</title>
<style>
:root{--bg:#0b0d14;--card:#151926;--line:#262c40;--tx:#eef1fa;--mut:#8f98b5;--ac:#ff6a1a;--ac2:#ffb347;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f4f5fa;--card:#fff;--line:#dde0ec;--tx:#14182b;--mut:#5e6685}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;line-height:1.5}
.w{max-width:1000px;margin:0 auto;padding:16px}
header{text-align:center;padding:28px 0 12px}
h1{margin:0;font-size:clamp(24px,5vw,38px);background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
header p{color:var(--mut);margin:6px 0 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px 0}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{flex:1;min-width:80px;padding:10px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--tx);font-weight:600;cursor:pointer}
.tab.on{background:linear-gradient(90deg,var(--ac),var(--ac2));color:#111;border-color:transparent}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:12px}
label{font-size:12px;color:var(--mut);display:block;margin-bottom:4px}
select,input{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font-size:15px}
.btn{width:100%;margin-top:14px;padding:13px;border:0;border-radius:12px;background:linear-gradient(90deg,var(--ac),var(--ac2));color:#111;font-weight:800;font-size:16px;cursor:pointer}
.btn.s{width:auto;padding:8px 14px;font-size:13px;margin:0}
.res h2{margin:0 0 4px;font-size:20px}.sub{color:var(--mut);font-size:13px;margin-bottom:12px}
.row{margin:10px 0}.row div.t{display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px}
.bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));border-radius:8px}
.tips{margin:0;padding-left:18px;color:var(--mut);font-size:14px}
.tw{overflow-x:auto;margin-top:10px}
table{border-collapse:collapse;width:100%;min-width:700px;font-size:13px}
th,td{padding:8px;border-bottom:1px solid var(--line);text-align:center}th:first-child,td:first-child{text-align:left}
th{color:var(--mut);font-weight:600;position:sticky;top:0;background:var(--card)}
tr.c{cursor:pointer}tr.c:hover{background:var(--bg)}
.note{font-size:12px;color:var(--mut);text-align:center;padding:10px 0 30px}
.hide{display:none}.res:not(.hide){animation:fadeIn .25s ease}@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.bar i{width:0;transition:width .7s ease}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:3px 10px;font-size:12px}.chip.a{border-color:var(--ac);color:var(--ac2)}
.stats{display:flex;justify-content:center;gap:22px;margin-top:14px;color:var(--mut);font-size:13px}.stats b{color:var(--ac2);font-size:20px;display:block}
.fg{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px}@media(max-width:560px){.fg{grid-template-columns:1fr 1fr}.fg input{grid-column:1/3}}
input[type=range]{padding:0;accent-color:var(--ac);height:36px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

/* SPEEDY premium branding */
body{overflow-x:hidden;background:radial-gradient(circle at 50% -10%,#2a1b12 0%,var(--bg) 42%)}
.hero{position:relative;text-align:center;padding:42px 0 18px}
.hero:before{content:"";position:absolute;width:220px;height:220px;left:50%;top:0;transform:translateX(-50%);background:var(--ac);filter:blur(90px);opacity:.13;pointer-events:none}
.logo-badge{display:inline-block;padding:6px 14px;border:1px solid rgba(255,179,71,.35);border-radius:999px;background:rgba(255,106,26,.08);color:var(--ac2);font-size:12px;font-weight:900;letter-spacing:2px;animation:pulse 2.2s infinite}
.hero h1{margin:12px 0 5px;font-size:clamp(30px,8vw,54px);font-weight:950;letter-spacing:-1.5px;text-shadow:0 0 28px rgba(255,106,26,.18)}
.hero h1 span{background:linear-gradient(90deg,#ff6a1a,#ffd166,#ff6a1a);background-size:200%;-webkit-background-clip:text;color:transparent;animation:shine 3s linear infinite}
.hero h1 strong{display:inline-block}
.hero-sub{margin:8px 0 0!important;color:var(--tx)!important;font-weight:650;font-size:15px}
.hero-line{width:90px;height:3px;margin:14px auto 9px;border-radius:5px;background:linear-gradient(90deg,transparent,var(--ac2),transparent);animation:lineGlow 2s infinite}
.brands{margin:0!important;font-size:12px!important;color:var(--mut)}
.insta-follow{display:inline-flex;align-items:center;justify-content:center;gap:8px;margin-top:14px;padding:10px 18px;border-radius:999px;text-decoration:none;color:#fff;font-weight:800;font-size:13px;letter-spacing:.2px;background:linear-gradient(135deg,#833ab4,#fd1d1d,#fcb045);box-shadow:0 8px 24px rgba(253,29,29,.22);transition:transform .2s ease,box-shadow .2s ease}
.insta-follow:hover{transform:translateY(-2px) scale(1.02);box-shadow:0 12px 30px rgba(253,29,29,.32)}
.insta-follow:active{transform:scale(.97)}
.card{box-shadow:0 10px 35px rgba(0,0,0,.18);transition:transform .25s ease,box-shadow .25s ease}
.card:hover{transform:translateY(-2px);box-shadow:0 14px 42px rgba(255,106,26,.09)}
.btn{position:relative;overflow:hidden;box-shadow:0 8px 24px rgba(255,106,26,.18);transition:transform .18s,box-shadow .18s}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(255,106,26,.3)}
.btn:active{transform:scale(.98)}
.btn:after{content:"";position:absolute;inset:0;transform:translateX(-110%);background:linear-gradient(90deg,transparent,rgba(255,255,255,.28),transparent);animation:sweep 3.5s infinite}
.tab{transition:.2s}.tab:hover{transform:translateY(-1px);border-color:var(--ac)}
@keyframes shine{to{background-position:200% center}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,106,26,.15)}50%{box-shadow:0 0 0 8px rgba(255,106,26,0)}}
@keyframes lineGlow{0%,100%{opacity:.55;transform:scaleX(.75)}50%{opacity:1;transform:scaleX(1.15)}}
@keyframes sweep{0%,65%{transform:translateX(-110%)}85%,100%{transform:translateX(110%)}}
@media(max-width:560px){.hero{padding-top:32px}.hero h1{line-height:1.05}.hero h1 strong{display:block}.hero-sub{font-size:13px}.brands{font-size:11px!important}}

/* Glassmorphism refresh + mobile-safe layout */
:root{--bg:#070b18;--card:rgba(255,255,255,.075);--line:rgba(255,255,255,.16);--tx:#f5f7ff;--mut:#b2bdd8;--ac:#6ee7ff;--ac2:#a78bfa}
body{min-height:100vh;background:radial-gradient(ellipse at 15% 5%,rgba(67,56,202,.35),transparent 42%),radial-gradient(ellipse at 85% 25%,rgba(14,165,233,.25),transparent 40%),linear-gradient(135deg,#070b18,#11152b 55%,#090d1b);background-attachment:fixed;overflow-x:hidden}
body:before,body:after{content:"";position:fixed;width:240px;height:240px;border-radius:50%;filter:blur(70px);opacity:.23;pointer-events:none;z-index:-1;animation:floatGlow 11s ease-in-out infinite alternate;background:#38bdf8;top:8%;left:-90px}
body:after{background:#8b5cf6;left:auto;right:-100px;top:52%;animation-delay:-4s}
.w{position:relative;z-index:1;max-width:1080px;padding:clamp(12px,3vw,24px)}
.card{background:linear-gradient(135deg,rgba(255,255,255,.12),rgba(255,255,255,.045));border:1px solid rgba(255,255,255,.19);box-shadow:0 18px 48px rgba(0,0,0,.24),inset 0 1px 0 rgba(255,255,255,.12);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:22px;transition:transform .25s ease,border-color .25s ease,box-shadow .25s ease}
.card:hover{border-color:rgba(110,231,255,.38);box-shadow:0 22px 55px rgba(0,0,0,.28),0 0 24px rgba(110,231,255,.06)}
header{padding:32px 0 18px}.logo-badge{display:inline-block;border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:6px 14px;background:rgba(255,255,255,.08);backdrop-filter:blur(12px);font-size:12px;letter-spacing:2px;margin-bottom:12px;color:#b9f4ff}
h1{background:linear-gradient(100deg,#fff,#8be9ff 35%,#c4b5fd 70%,#fff);background-size:200% auto;animation:shine 6s linear infinite;-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none}
.hero-sub{color:#c6d3ee}.hero-line{height:2px;width:120px;margin:15px auto;background:linear-gradient(90deg,transparent,#67e8f9,#a78bfa,transparent);animation:lineGlow 3s ease-in-out infinite}
.stats{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:18px}.stats>div,.chip{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:9px 14px;backdrop-filter:blur(10px)}.stats b{display:block;color:#9beeff;font-size:20px}.stats span{font-size:11px;color:var(--mut)}
.tabs{gap:8px}.tab{background:rgba(255,255,255,.055);border-color:rgba(255,255,255,.15);border-radius:12px;transition:all .2s}.tab.on{background:linear-gradient(110deg,#67e8f9,#a78bfa);color:#07111e;box-shadow:0 7px 20px rgba(103,232,249,.18)}
select,input{background:rgba(6,10,25,.58);border-color:rgba(255,255,255,.18);border-radius:12px;outline:none}select:focus,input:focus{border-color:#67e8f9;box-shadow:0 0 0 3px rgba(103,232,249,.12)}
.btn{position:relative;overflow:hidden;border-radius:14px;background:linear-gradient(105deg,#67e8f9,#a78bfa);box-shadow:0 10px 26px rgba(103,232,249,.13);transition:transform .2s,filter .2s}.btn:hover{transform:translateY(-2px);filter:brightness(1.07)}.btn:active{transform:scale(.985)}
.bar{background:rgba(255,255,255,.12)}.bar i{background:linear-gradient(90deg,#67e8f9,#a78bfa)}
